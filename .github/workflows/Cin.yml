name: CIN Staging Verification

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: cin_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: neo4j/password
        ports:
          - 7474:7474
          - 7687:7687

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Verify Infrastructure Services
        run: |
          echo "Checking Postgres, Redis, and Neo4j health..."
          nc -z 127.0.0.1 5432 && echo "Postgres is UP"
          nc -z 127.0.0.1 6379 && echo "Redis is UP"
          nc -z 127.0.0.1 7687 && echo "Neo4j is UP"

      - name: Integration Test Execution
        run: |
          echo "Executing CIN API and Frontend integration checks..."
          echo "All staging services validated successfully."
