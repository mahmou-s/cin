name: CIN CI

on:
  push:
  pull_request:

jobs:
  stack-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment from .env.example
        run: |
          cp .env.example .env
          echo "API_PORT=$(grep -E '^API_PORT=' .env | cut -d= -f2)" >> "$GITHUB_ENV"
          echo "WEB_PORT=$(grep -E '^WEB_PORT=' .env | cut -d= -f2)" >> "$GITHUB_ENV"

      - name: Build and start the full stack (docker compose)
        run: docker compose up -d --build

      - name: Show running services
        run: docker compose ps

      - name: Wait for API to respond
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:${API_PORT:-8000}/docs" > /dev/null; then
              echo "API is up"; exit 0
            fi
            sleep 3
          done
          echo "API did not become ready"
          docker compose logs --no-color | tail -150
          exit 1

      - name: Protected endpoint must reject anonymous calls
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "http://127.0.0.1:${API_PORT:-8000}/api/v1/outreach/signal" || true)
          echo "Anonymous POST status: $code"
          [ "$code" = "401" ] || [ "$code" = "403" ] || [ "$code" = "422" ]

      - name: Web responds
        run: |
          for i in $(seq 1 40); do
            if curl -fsS "http://127.0.0.1:${WEB_PORT:-3000}/" > /dev/null; then
              echo "Web is up"; exit 0
            fi
            sleep 3
          done
          docker compose logs web --no-color | tail -100
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Python tests
        env:
          PYTHONPATH: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          if [ -f apps/api/requirements-dev.txt ]; then pip install -r apps/api/requirements-dev.txt; fi
          pytest -q

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -300

      - name: Stop stack
        if: always()
        run: docker compose down -v
