services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cin}
      POSTGRES_USER: ${POSTGRES_USER:-cin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cin} -d ${POSTGRES_DB:-cin}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [cin_backend]

  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}"
      NEO4J_PLUGINS: '[]'
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_INITIAL:-512m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX:-1g}
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks: [cin_backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [cin_backend]

  migration:
    build:
      context: ./apps/api
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-cin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cin}"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [cin_backend]

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-cin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cin}"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      EVIDENCE_DIR: /data/evidence
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      CIN_AUTH_API_KEYS: ${CIN_AUTH_API_KEYS:?CIN_AUTH_API_KEYS is required}
      CONFIDENCE_COMBINED_SUPPORT_CAP: ${CONFIDENCE_COMBINED_SUPPORT_CAP:-0.90}
      CONFIDENCE_HIGH_MIN_GROUP_SCORE: ${CONFIDENCE_HIGH_MIN_GROUP_SCORE:-0.70}
      CONFIDENCE_HIGH_SCORE_THRESHOLD: ${CONFIDENCE_HIGH_SCORE_THRESHOLD:-0.85}
      CONFIDENCE_HIGH_MIN_INDEPENDENT_GROUPS: ${CONFIDENCE_HIGH_MIN_INDEPENDENT_GROUPS:-2}
      OUTBOX_RECONCILE_INTERVAL_SECONDS: ${OUTBOX_RECONCILE_INTERVAL_SECONDS:-30}
      OUTREACH_RECONCILE_INTERVAL_SECONDS: ${OUTREACH_RECONCILE_INTERVAL_SECONDS:-60}
      PROCESSING_TIMEOUT_SECONDS: ${PROCESSING_TIMEOUT_SECONDS:-900}
      OUTBOX_BACKOFF_BASE_SECONDS: ${OUTBOX_BACKOFF_BASE_SECONDS:-2}
      OUTBOX_SOCKET_TIMEOUT_SECONDS: ${OUTBOX_SOCKET_TIMEOUT_SECONDS:-1.5}
    volumes:
      - evidence_data:/data/evidence
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=4)"]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 40s
    depends_on:
      migration:
        condition: service_completed_successfully
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [cin_backend, cin_frontend]

  worker:
    build:
      context: ./apps/api
    restart: unless-stopped
    command: ["python", "-m", "app.services.outbox_worker"]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-cin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cin}"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      OUTBOX_RECONCILE_INTERVAL_SECONDS: ${OUTBOX_RECONCILE_INTERVAL_SECONDS:-30}
      PROCESSING_TIMEOUT_SECONDS: ${PROCESSING_TIMEOUT_SECONDS:-900}
      OUTBOX_BACKOFF_BASE_SECONDS: ${OUTBOX_BACKOFF_BASE_SECONDS:-2}
      OUTBOX_SOCKET_TIMEOUT_SECONDS: ${OUTBOX_SOCKET_TIMEOUT_SECONDS:-1.5}
    depends_on:
      migration:
        condition: service_completed_successfully
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [cin_backend]

  outreach_worker:
    build:
      context: ./apps/api
    restart: unless-stopped
    command: ["python", "-m", "app.services.outreach_worker"]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-cin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cin}"
      OUTREACH_RECONCILE_INTERVAL_SECONDS: ${OUTREACH_RECONCILE_INTERVAL_SECONDS:-60}
    depends_on:
      migration:
        condition: service_completed_successfully
    networks: [cin_backend]

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      api:
        condition: service_healthy
    networks: [cin_frontend]

volumes:
  pg_data:
  neo4j_data:
  neo4j_logs:
  redis_data:
  evidence_data:

networks:
  cin_backend:
    driver: bridge
  cin_frontend:
    driver: bridge
